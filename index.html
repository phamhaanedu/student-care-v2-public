<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - Student Care V2</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar sẽ được JS tự động render vào đây dựa trên phân quyền -->
        <nav id="sidebar" class="sidebar"></nav>
        
        <main class="main-content">
            <!-- Header sẽ được JS tự động render vào đây -->
            <header id="header" class="header"></header>
            
            <div class="content-body">
                <div class="card">
                    <h2 class="card-title">Xin chào, đây là trang Tổng quan (Dashboard)</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">
                        Tính năng Thống kê (Biểu đồ) cho nhiệm vụ chăm sóc sinh viên sẽ được cập nhật sau.
                        <br>Vui lòng sử dụng thanh điều hướng bên trái để thao tác các tính năng tương ứng với quyền hạn của bạn.
                    </p>
                </div>
            </div>
        </main>
    </div>

    <!-- Script điều khiển Layout -->
    <script type="module" src="js/layout.js"></script>
</body>
</html>
